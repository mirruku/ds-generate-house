<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CASA SERENA · 暮光之宅</title>
<style>
  :root{
    --ink:#f4efe7;
    --muted:rgba(244,239,231,.58);
    --line:rgba(244,239,231,.18);
    --gold:#d8b98d;
    --panel:rgba(19,20,18,.38);
    --panel-hover:rgba(30,31,27,.58);
  }
  *{ box-sizing:border-box; }
  html,body{ width:100%; height:100%; margin:0; overflow:hidden; background:#0d1115; }
  body{
    font-family: "Helvetica Neue", "Segoe UI", "Microsoft YaHei", sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #stage{ position:fixed; inset:0; }
  #stage canvas{ display:block; width:100%; height:100%; outline:none; }

  .vignette{
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:
      radial-gradient(ellipse at 50% 44%, transparent 42%, rgba(5,8,10,.23) 100%),
      linear-gradient(180deg, rgba(4,7,9,.28) 0%, transparent 18%, transparent 72%, rgba(4,7,9,.48) 100%);
  }
  .grain{
    position:fixed; inset:-50%; pointer-events:none; z-index:3; opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    animation: grain 8s steps(10) infinite;
  }
  @keyframes grain{
    0%,100%{ transform:translate(0,0) } 10%{ transform:translate(-2%,-3%) }
    20%{ transform:translate(-4%,2%) } 30%{ transform:translate(2%,-4%) }
    40%{ transform:translate(-3%,3%) } 50%{ transform:translate(4%,1%) }
    60%{ transform:translate(1%,4%) } 70%{ transform:translate(-4%,-2%) }
    80%{ transform:translate(3%,2%) } 90%{ transform:translate(-1%,4%) }
  }

  .ui{ position:fixed; inset:0; z-index:10; pointer-events:none; }

  .topbar{
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:34px 40px;
  }
  .brand{ display:flex; align-items:flex-start; gap:15px; }
  .monogram{
    width:39px; height:39px; border:1px solid rgba(244,239,231,.42);
    border-radius:50%; display:grid; place-items:center;
    font-family:Georgia, "Times New Roman", serif; font-size:13px; letter-spacing:.12em;
    color:var(--ink); padding-left:2px; margin-top:2px;
  }
  .brand-copy{ line-height:1.1; }
  .brand-name{
    font-family:Georgia, "Times New Roman", "Songti SC", serif;
    font-size:17px; letter-spacing:.29em; font-weight:400;
  }
  .brand-sub{
    margin-top:9px; font-size:9px; letter-spacing:.26em; color:var(--muted);
    text-transform:uppercase;
  }

  .actions{ display:flex; align-items:center; gap:9px; pointer-events:auto; }
  .pill{
    appearance:none; border:1px solid var(--line); color:var(--ink);
    background:var(--panel); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    height:39px; padding:0 16px; border-radius:999px; cursor:pointer;
    font-family:inherit; font-size:11px; letter-spacing:.1em;
    display:inline-flex; align-items:center; gap:9px;
    transition:background .3s ease, border-color .3s ease, transform .3s ease;
  }
  .pill:hover{ background:var(--panel-hover); border-color:rgba(244,239,231,.38); }
  .pill:active{ transform:scale(.97); }
  .pill svg{ width:14px; height:14px; opacity:.85; }
  .pill .icon-sun{ display:none; }
  .pill.night .icon-moon{ display:none; }
  .pill.night .icon-sun{ display:block; }
  .pill .state{
    width:5px; height:5px; border-radius:50%; background:var(--gold);
    box-shadow:0 0 10px rgba(216,185,141,.8);
    transition:background .4s ease, box-shadow .4s ease;
  }
  .pill.night .state{ background:#a8c9ea; box-shadow:0 0 10px rgba(168,201,234,.85); }
  .icon-pill{ width:39px; padding:0; justify-content:center; }

  .hero{
    position:absolute; left:42px; bottom:42px; max-width:500px;
  }
  .eyebrow{
    display:flex; align-items:center; gap:13px; margin-bottom:19px;
    font-size:9px; letter-spacing:.31em; color:var(--gold); text-transform:uppercase;
  }
  .eyebrow::before{ content:""; width:35px; height:1px; background:var(--gold); opacity:.7; }
  h1{
    margin:0; font-family:Georgia, "Times New Roman", "Songti SC", serif;
    font-weight:400; font-size:clamp(38px,4.4vw,68px); line-height:.95;
    letter-spacing:.055em; text-shadow:0 2px 30px rgba(0,0,0,.2);
  }
  h1 span{ display:block; font-size:.31em; letter-spacing:.4em; color:var(--muted); margin-top:18px; }
  .hero p{
    margin:21px 0 0 1px; font-size:12px; line-height:2; letter-spacing:.12em;
    color:rgba(244,239,231,.7); max-width:360px;
  }
  .specs{
    display:flex; gap:28px; margin-top:25px; padding-top:17px;
    border-top:1px solid var(--line); width:340px;
  }
  .spec b{ display:block; font-family:Georgia,serif; font-size:15px; font-weight:400; letter-spacing:.08em; }
  .spec small{ display:block; margin-top:6px; font-size:8px; letter-spacing:.21em; color:var(--muted); text-transform:uppercase; }

  .hint{
    position:absolute; right:41px; bottom:45px; display:flex; align-items:center; gap:11px;
    font-size:9px; letter-spacing:.18em; color:rgba(244,239,231,.5); text-transform:uppercase;
  }
  .hint .mouse{
    width:16px; height:23px; border:1px solid rgba(244,239,231,.36); border-radius:9px; position:relative;
  }
  .hint .mouse::after{
    content:""; position:absolute; left:50%; top:5px; width:2px; height:4px; border-radius:2px;
    background:rgba(244,239,231,.6); transform:translateX(-50%);
    animation:wheel 2.2s ease-in-out infinite;
  }
  @keyframes wheel{ 0%,100%{ transform:translate(-50%,0); opacity:.8 } 50%{ transform:translate(-50%,5px); opacity:.25 } }

  .loader{
    position:fixed; inset:0; z-index:50; background:#0c0f11;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;
    transition:opacity 1.15s ease, visibility 1.15s ease;
  }
  .loader.hidden{ opacity:0; visibility:hidden; }
  .loader-mark{
    font-family:Georgia,serif; font-size:20px; letter-spacing:.4em; color:#eee6d9; padding-left:.4em;
  }
  .loader-ring{
    width:64px; height:64px; border-radius:50%; border:1px solid rgba(216,185,141,.16);
    border-top-color:rgba(216,185,141,.9); animation:spin 1.5s cubic-bezier(.6,.2,.3,.8) infinite;
  }
  .loader-copy{ font-size:9px; letter-spacing:.3em; color:rgba(244,239,231,.45); text-transform:uppercase; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .fade-in{ opacity:0; transform:translateY(14px); animation:rise 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1{ animation-delay:.25s } .d2{ animation-delay:.4s } .d3{ animation-delay:.55s }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  @media (max-width: 760px){
    .topbar{ padding:22px 20px; }
    .brand-sub{ display:none; }
    .brand-name{ font-size:14px; }
    .monogram{ width:34px; height:34px; }
    .actions .label, .actions .state{ display:none; }
    .pill{ height:35px; padding:0; width:35px; justify-content:center; gap:0; }
    .icon-pill{ width:35px; }
    .hero{ left:22px; right:22px; bottom:26px; }
    .hero p{ display:none; }
    .specs{ display:none; }
    .hint{ display:none; }
    h1{ font-size:43px; }
    h1 span{ margin-top:13px; font-size:.27em; letter-spacing:.28em; }
  }
  @media (prefers-reduced-motion: reduce){
    .fade-in{ animation:none; opacity:1; transform:none; }
    .grain{ animation:none; }
  }
</style>
</head>
<body>
  <div id="stage" aria-label="可交互的现代别墅三维场景"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="ui">
    <header class="topbar">
      <div class="brand fade-in d1">
        <div class="monogram">CS</div>
        <div class="brand-copy">
          <div class="brand-name">CASA SERENA</div>
          <div class="brand-sub">Architectural study · MMXXVI</div>
        </div>
      </div>
      <div class="actions fade-in d1">
        <button class="pill" id="modeBtn" type="button" aria-label="切换昼夜">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M20.5 14.2A8.3 8.3 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>
          <span class="label" id="modeLabel">夜幕</span>
          <span class="state" id="modeState"></span>
        </button>
        <button class="pill" id="orbitBtn" type="button" aria-label="切换自动环绕">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
          <span class="label">自动环绕</span>
        </button>
        <button class="pill icon-pill" id="resetBtn" type="button" aria-label="重置视角" title="重置视角">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 4v6h6"/><path d="M4.6 15a8 8 0 1 0 .8-7.9L4 10"/></svg>
        </button>
      </div>
    </header>

    <section class="hero">
      <div class="eyebrow fade-in d2">Hillside residence · 01</div>
      <h1 class="fade-in d2">暮光之宅<span>WHERE LIGHT COMES HOME</span></h1>
      <p class="fade-in d3">悬浮于山脊之上的现代居所。石材、原木与玻璃在暮色中相遇，<br />让每一个房间都收藏一整片天空。</p>
      <div class="specs fade-in d3">
        <div class="spec"><b>420 m²</b><small>Interior</small></div>
        <div class="spec"><b>4</b><small>Bedrooms</small></div>
        <div class="spec"><b>6.2 m</b><small>Pool length</small></div>
      </div>
    </section>

    <div class="hint fade-in d3">
      <span class="mouse"></span>
      <span>拖拽旋转 · 滚轮缩放</span>
    </div>
  </div>

  <div class="loader" id="loader">
    <div class="loader-mark">CASA SERENA</div>
    <div class="loader-ring"></div>
    <div class="loader-copy" id="loaderCopy">正在构筑空间</div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
